<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoppr</title>
    <link rel="stylesheet" href="https://use.typekit.net/hgc5hqd.css">
    <link rel="icon" type="image/png" href="assets/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "header"> 
        <div class = "logo"> 
            <a href="index.html">
                <img src="logo-pic.png" width="130" height="45">
            </a>
        </div>
        <div class = "right-section">
            <div class = "search-bar"> 
                <input class ="input" type="text" placeholder="Search for products" size = "50">
            </div>
            <button class = "search-icon" onclick="searchDisplay()"> 
                <img src="assets/search-icon.png" alt="Search" width="27" height="27">
            </button>
            <button class = "cart-button" onclick = "window.location.href= 'checkout.html'">
                <div class = "cart-icon"> 
                    <img src="assets/cart-icon.png" alt="Cart" width="30" height="28">
                    <div class ="cart-icon-bubble"></div>
                </div>
            </button>
            <button class="wish-list-button" onclick ="window.location.href = 'wishlist.html'">
                <img width="27" height="27" src="https://img.icons8.com/fluency-systems-regular/48/4D4D4D/like--v1.png" alt="like"/>
            </button>
        </div>
    </div>
    <div class = "main-content-image">
        <div class = "main-text">
            <p> Browse gadgets & tech</p>
            <p class="top-deals"> Top deals on the latest tech</p>
            <button onclick="shopNow()">Shop Now</button>
        </div>
        <img src="assets/header-image.png">
    </div>
</div class = "product-section">
    <div class ="category-buttons-container">
        <button class ="category-buttons" id="All" style = "border-color:#001F3F; border-width: 1.4px;">All</button>
        <button class="category-buttons" id="Gadgets">Gadgets</button>
        <button class="category-buttons" id="Clothing">Clothing</button>
        <button class="category-buttons" id="Jewelry">Jewelry</button>
    </div>
    <div class = "product-grid">
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
