<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "header"> 
        <div class = "logo"> 
            <img src="assets/logo.png" alt="Logo" width="250" height="250"> 
        </div>
        <div class = "right-section">
            <div class = "search-bar"> 
                <input type="text" placeholder="Search for products..." size = "50">
            </div>
            <div class = "search-icon"> 
                <img src="assets/search-icon.png" alt="Search" width="50" height="50">
             </div>
            <div class = "cart-icon"> 
                <img src="assets/cart-icon.png" alt="Cart" width="28" height="28">
             </div>
        </div>
    </div>
    <div class = "main-content-image">
        <img src="assets/model.jpg" alt="Main Content" width="1440" height="1080">
        <div class = "main-text">
            <button class = "shop-button"> Shop Women's Clothing  +  </button>
        </div>
    </div>
</div class = "product-section">
    <h2 style = "font-weight: 100; font-size: 30px; font-family: system-ui"> Featured Products </h2>
    <div class = "product-grid">
        <div class = "product-item">
            <img src="assets/product1.jpg" alt="Product 1" width="300" height="400">
            <p>Product 1 Description</p>
            <p>$29.99</p>
        </div>
        <div class = "product-item">
            <img src="assets/product1.jpg" alt="Product 2" width="300" height="400">
            <p>Product 2 Description</p>
            <p>$39.99</p>
        </div>
        <div class = "product-item">
            <img src="assets/product1.jpg" alt="Product 3" width="300" height="400">
            <p>Product 3 Description</p>
            <p>$49.99</p>
        </div>
        <div class = "product-item">
            <img src="assets/product1.jpg" alt="Product 4" width="300" height="400">
            <p>Product 4 Description</p>
            <p>$59.99</p>
        </div>
    </div>
</body>
</html>
