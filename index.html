<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "header"> 
        <div class = "logo"> 
            <img src="assets/logo.png" alt="Logo" width="250" height="250"> 
        </div>
        <div class = "right-section">
            <div class = "search-bar"> 
                <input type="text" placeholder="Search for products..." size = "50">
            </div>
            <div class = "search-icon"> 
                <img src="assets/search-icon.png" alt="Search" width="50" height="50">
            </div>
            <button class = "cart-button" onclick = "window.location.href= 'checkout.html'">
                <div class = "cart-icon"> 
                    <img src="assets/cart-icon.png" alt="Cart" width="28" height="28">
                </div>
            </button>
        </div>
    </div>
    <div class = "main-content-image">
        <div class = "main-text">
            <button class = "shop-button"> Shop Women's Clothing  +  </button>
        </div>
    </div>
</div class = "product-section">
    <h2 style = "font-weight: 100; font-size: 27px; font-family: system-ui"> Featured Products </h2>
    <div class = "product-grid">
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
